# Book Description (for metadata)
description: |
  An analytical deep dive into NVIDIA Corporation: the CUDA platform moat, the
  AI factory strategy, and the full financial record. Current as of October
  2026, it covers fiscal 2027's accelerating quarters (Q2 revenue of $96.2
  billion, up 106 percent), the supply-constrained fiscal 2028 outlook, the
  Vera Rubin ramp, China revenue at zero against Huawei's rise, NVIDIA's
  transformation into the balance sheet behind its own customers, and a
  re-based scenario outlook with the book's own house view and falsifiers.

