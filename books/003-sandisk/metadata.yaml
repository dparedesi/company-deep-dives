# Book Description (for metadata)
description: |
  The deepest publicly available analysis of SanDisk Corporation, from its 1988
  founding as SunDisk through its growth into a global flash memory leader,
  its 2016 acquisition by Western Digital, and its remarkable re-emergence as
  an independent company in February 2025. Current as of April 2026.

