# Book Metadata
# =============
# This file controls how your book is built and styled.

# Basic Information
title: "The Palantir Enigma"
subtitle: "Forging Operational Sovereignty in a Data-Driven World (Second Edition)"
author: "Daniel Paredes"
date: "December 2025"
language: en

# Cover Image (relative to images/ folder)
cover_image: cover.jpg

# Table of Contents
toc: true
toc_depth: 3

# Chapter Numbering
number_sections: true

# PDF Styling (used by Typst template)
pdf:
  paper_size: "us-letter"  # or "a4"
  font_size: "11pt"
  margin:
    top: "1in"
    bottom: "1in"
    left: "1.25in"
    right: "1.25in"
  fonts:
    main: "Linux Libertine"  # or any font installed on your system
    code: "Fira Code"
  colors:
    primary: "#2c3e50"      # Headers, links
    accent: "#3498db"       # Highlights

# EPUB Styling
epub:
  chapter_level: 1

# Book Description (for metadata)
description: |
  This book offers an exceptionally comprehensive and in-depth analysis 
  of Palantir Technologies, moving beyond readily available summaries 
  to uncover novel insights and connections. Current as of December 1, 2025,
  this Second Edition incorporates Palantir's inclusion in the S&P 500,
  its strategic transfer to Nasdaq, and the transition of AIP from pilot
  projects to production agentic workflows.

# Keywords/Tags
keywords:
  - Palantir
  - Data Analytics
  - AI
  - Technology
  - Business Analysis
  - Operational Sovereignty
  - AIP
  - Enterprise AI

