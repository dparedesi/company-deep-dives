# Book Description (for metadata)
description: |
  An analytical deep dive into Palantir Technologies: the ontology-centered
  platforms, the financial record, and the Operational Sovereignty thesis.
  Current as of October 2026, it covers the Iran war and Maven at scale,
  the NHS Federated Data Platform renewal crisis, the sovereign AI program
  line, Q2 2026 results at 93 percent growth, and a re-based scenario
  outlook with the book's own house view and falsifiers.

